<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Programs</title>
</head>
<body>

    <script>

        // 1. Reverse a string

        let str = "Hello";
        let reverse = "";
        for (let i = str.length - 1; i >= 0; i--) {
            reverse = reverse + str[i];
        }
        console.log("Reverse string:", reverse);


        // 2. Check whether a string is a palindrome

        let word = "madam";
        let palindromeReverse = "";
        for (let i = word.length - 1; i >= 0; i--) {
            palindromeReverse = palindromeReverse + word[i];
        }
        if (word === palindromeReverse) {
            console.log("It is a Palindrome");
        } else {
            console.log("It is not a Palindrome");
        }


        // 3. Find the largest number in an array

        let numbers = [10, 25, 5, 40, 15];

        let largest = numbers[0];
        for (let i = 1; i < numbers.length; i++) {
            if (numbers[i] > largest) {
                largest = numbers[i];
            }
        }
        console.log("Largest number:", largest);


        // 4. Remove the first element from an array

        let fruits = ["Apple", "Banana", "Orange", "Mango"];
        fruits.shift();
        console.log("Updated fruits:", fruits);

    </script>

</body>
</html>
